<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 - 随手记ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            margin: 0;
            padding: 0;
        }
        .settings-container {
            padding: 15px;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .setting-group {
            margin-bottom: 20px;
        }
        .setting-group-title {
            font-size: 14px;
            color: #8E8E93;
            margin-bottom: 10px;
            padding-left: 5px;
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #F2F2F7;
        }
        .setting-item:last-child {
            border-bottom: none;
        }
        .setting-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 18px;
            color: white;
        }
        .setting-details {
            flex: 1;
        }
        .setting-action {
            color: #8E8E93;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 30px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #E5E5EA;
            transition: .4s;
            border-radius: 30px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background-color: #34C759;
        }
        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }
        .profile-section {
            display: flex;
            align-items: center;
            padding: 20px 0;
        }
        .profile-avatar {
            width: 70px;
            height: 70px;
            border-radius: 35px;
            overflow: hidden;
            margin-right: 15px;
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-info {
            flex: 1;
        }
        .profile-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .profile-role {
            color: #8E8E93;
            font-size: 14px;
        }
        .badge {
            background-color: #FF3B30;
            color: white;
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <div class="header">
            <h1 class="text-xl font-bold">系统设置</h1>
        </div>
        
        <div class="card">
            <div class="profile-section">
                <div class="profile-avatar">
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="个人头像">
                </div>
                <div class="profile-info">
                    <div class="profile-name">张经理</div>
                    <div class="profile-role">超级管理员</div>
                </div>
                <div class="setting-action">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>
        
        <div class="setting-group">
            <div class="setting-group-title">账户与安全</div>
            <div class="card">
                <div class="setting-item">
                    <div class="flex items-center">
                        <div class="setting-icon bg-blue-500">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="setting-details">
                            <p class="font-medium">个人信息</p>
                        </div>
                    </div>
                    <div class="setting-action">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                
                <div class="setting-item">
                    <div class="flex items-center">
                        <div class="setting-icon bg-green-500">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div class="setting-details">
                            <p class="font-medium">账户安全</p>
                        </div>
                    </div>
                    <div class="setting-action">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                
                <div class="setting-item">
                    <div class="flex items-center">
                        <div class="setting-icon bg-purple-500">
                            <i class="fas fa-bell"></i>
                        </div>
                        <div class="setting-details">
                            <p class="font-medium">通知设置</p>
                        </div>
                    </div>
                    <div class="setting-action">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="setting-group">
            <div class="setting-group-title">系统管理</div>
            <div class="card">
                <div class="setting-item">
                    <div class="flex items-center">
                        <div class="setting-icon bg-yellow-500">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="setting-details">
                            <p class="font-medium">用户管理</p>
                        </div>
                    </div>
                    <div class="setting-action">
                        <div class="badge">3</div>
                    </div>
                </div>
                
                <div class="setting-item">
                    <div class="flex items-center">
                        <div class="setting-icon bg-red-500">
                            <i class="fas fa-key"></i>
                        </div>
                        <div class="setting-details">
                            <p class="font-medium">角色与权限</p>
                        </div>
                    </div>
                    <div class="setting-action">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                
                <div class="setting-item">
                    <div class="flex items-center">
                        <div class="setting-icon bg-indigo-500">
                            <i class="fas fa-database"></i>
                        </div>
                        <div class="setting-details">
                            <p class="font-medium">数据备份</p>
                        </div>
                    </div>
                    <div class="setting-action">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                
                <div class="setting-item">
                    <div class="flex items-center">
                        <div class="setting-icon bg-pink-500">
                            <i class="fas fa-cog"></i>
                        </div>
                        <div class="setting-details">
                            <p class="font-medium">系统参数</p>
                        </div>
                    </div>
                    <div class="setting-action">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="setting-group">
            <div class="setting-group-title">应用设置</div>
            <div class="card">
                <div class="setting-item">
                    <div class="flex items-center">
                        <div class="setting-icon bg-blue-400">
                            <i class="fas fa-moon"></i>
                        </div>
                        <div class="setting-details">
                            <p class="font-medium">深色模式</p>
                        </div>
                    </div>
                    <div class="setting-action">
                        <label class="toggle-switch">
                            <input type="checkbox">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
                
                <div class="setting-item">
                    <div class="flex items-center">
                        <div class="setting-icon bg-teal-500">
                            <i class="fas fa-language"></i>
                        </div>
                        <div class="setting-details">
                            <p class="font-medium">语言</p>
                        </div>
                    </div>
                    <div class="setting-action">
                        <span class="text-gray-500 mr-2">简体中文</span>
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                
                <div class="setting-item">
                    <div class="flex items-center">
                        <div class="setting-icon bg-orange-500">
                            <i class="fas fa-font"></i>
                        </div>
                        <div class="setting-details">
                            <p class="font-medium">字体大小</p>
                        </div>
                    </div>
                    <div class="setting-action">
                        <span class="text-gray-500 mr-2">中</span>
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="setting-group">
            <div class="setting-group-title">关于</div>
            <div class="card">
                <div class="setting-item">
                    <div class="flex items-center">
                        <div class="setting-icon bg-gray-500">
                            <i class="fas fa-info-circle"></i>
                        </div>
                        <div class="setting-details">
                            <p class="font-medium">关于我们</p>
                        </div>
                    </div>
                    <div class="setting-action">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                
                <div class="setting-item">
                    <div class="flex items-center">
                        <div class="setting-icon bg-gray-500">
                            <i class="fas fa-question-circle"></i>
                        </div>
                        <div class="setting-details">
                            <p class="font-medium">帮助与反馈</p>
                        </div>
                    </div>
                    <div class="setting-action">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                
                <div class="setting-item">
                    <div class="flex items-center">
                        <div class="setting-icon bg-gray-500">
                            <i class="fas fa-code"></i>
                        </div>
                        <div class="setting-details">
                            <p class="font-medium">版本信息</p>
                        </div>
                    </div>
                    <div class="setting-action">
                        <span class="text-gray-500">v1.0.0</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card mt-5">
            <button class="w-full py-3 text-red-500 font-medium">退出登录</button>
        </div>
    </div>
</body>
</html>
