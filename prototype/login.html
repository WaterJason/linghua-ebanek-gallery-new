<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 随手记ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: white;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .login-container {
            padding: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .input-field {
            background-color: #F2F2F7;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 16px;
            border: none;
            width: 100%;
        }
        .login-button {
            background-color: #007AFF;
            color: white;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            width: 100%;
            margin-top: 10px;
        }
        .login-button:disabled {
            background-color: #B0B0B0;
        }
        .login-options {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            color: #007AFF;
            font-size: 14px;
        }
        .social-login {
            display: flex;
            justify-content: center;
            margin-top: auto;
            margin-bottom: 40px;
        }
        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background-color: #F2F2F7;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            font-size: 24px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="flex justify-center mt-10 mb-8">
            <img src="https://via.placeholder.com/120" alt="Logo" class="w-24 h-24 rounded-xl">
        </div>
        
        <h1 class="text-2xl font-bold text-center mb-10">随手记ERP</h1>
        
        <div class="mb-6">
            <input type="text" class="input-field" placeholder="用户名/手机号">
            <div class="relative">
                <input type="password" class="input-field pr-10" placeholder="密码">
                <i class="fas fa-eye-slash absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            </div>
        </div>
        
        <button class="login-button">登录</button>
        
        <div class="login-options">
            <span>注册账号</span>
            <span>忘记密码?</span>
        </div>
        
        <div class="mt-10 text-center text-gray-400 text-sm">
            <div class="flex items-center justify-center">
                <div class="h-px bg-gray-300 w-16"></div>
                <div class="mx-4">其他登录方式</div>
                <div class="h-px bg-gray-300 w-16"></div>
            </div>
        </div>
        
        <div class="social-login">
            <div class="social-icon">
                <i class="fab fa-weixin text-green-500"></i>
            </div>
            <div class="social-icon">
                <i class="fas fa-mobile-alt text-blue-500"></i>
            </div>
            <div class="social-icon">
                <i class="fab fa-qq text-blue-400"></i>
            </div>
        </div>
        
        <div class="text-center text-xs text-gray-400 mb-4">
            登录即表示您同意<span class="text-blue-500">用户协议</span>和<span class="text-blue-500">隐私政策</span>
        </div>
    </div>
</body>
</html>
