<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记账 - 随手记ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            margin: 0;
            padding: 0;
        }
        .transaction-container {
            padding: 15px;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tab-container {
            display: flex;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 16px;
            color: #8E8E93;
            background-color: #F2F2F7;
        }
        .tab:first-child {
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }
        .tab:last-child {
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        .tab.active {
            color: white;
            background-color: #007AFF;
            font-weight: 600;
        }
        .amount-input {
            font-size: 32px;
            font-weight: 600;
            text-align: center;
            width: 100%;
            border: none;
            outline: none;
            margin: 20px 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #8E8E93;
        }
        .form-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #E5E5EA;
            font-size: 16px;
            background-color: #F9F9F9;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        .category-icon {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background-color: #F2F2F7;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 20px;
        }
        .category-item.selected .category-icon {
            background-color: #007AFF;
            color: white;
        }
        .submit-button {
            background-color: #007AFF;
            color: white;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="transaction-container">
        <div class="header">
            <div class="flex items-center">
                <i class="fas fa-arrow-left text-gray-600 text-xl mr-3"></i>
                <h1 class="text-xl font-bold">记一笔</h1>
            </div>
            <div>
                <i class="fas fa-camera text-gray-600 text-xl"></i>
            </div>
        </div>
        
        <div class="tab-container">
            <div class="tab">收入</div>
            <div class="tab active">支出</div>
            <div class="tab">转账</div>
        </div>
        
        <div class="card">
            <input type="text" class="amount-input" placeholder="¥0.00" value="¥2,500.00">
            
            <div class="form-group">
                <label class="form-label">分类</label>
                <div class="category-grid">
                    <div class="category-item selected">
                        <div class="category-icon">
                            <i class="fas fa-shopping-bag"></i>
                        </div>
                        <span class="text-xs">采购</span>
                    </div>
                    <div class="category-item">
                        <div class="category-icon">
                            <i class="fas fa-truck"></i>
                        </div>
                        <span class="text-xs">物流</span>
                    </div>
                    <div class="category-item">
                        <div class="category-icon">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <span class="text-xs">工资</span>
                    </div>
                    <div class="category-item">
                        <div class="category-icon">
                            <i class="fas fa-tools"></i>
                        </div>
                        <span class="text-xs">设备</span>
                    </div>
                    <div class="category-item">
                        <div class="category-icon">
                            <i class="fas fa-building"></i>
                        </div>
                        <span class="text-xs">租金</span>
                    </div>
                    <div class="category-item">
                        <div class="category-icon">
                            <i class="fas fa-lightbulb"></i>
                        </div>
                        <span class="text-xs">水电</span>
                    </div>
                    <div class="category-item">
                        <div class="category-icon">
                            <i class="fas fa-ad"></i>
                        </div>
                        <span class="text-xs">广告</span>
                    </div>
                    <div class="category-item">
                        <div class="category-icon">
                            <i class="fas fa-ellipsis-h"></i>
                        </div>
                        <span class="text-xs">其他</span>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">账户</label>
                <select class="form-input">
                    <option>企业账户</option>
                    <option>现金</option>
                    <option>银行卡</option>
                    <option>支付宝</option>
                    <option>微信</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">日期</label>
                <input type="date" class="form-input" value="2025-05-24">
            </div>
            
            <div class="form-group">
                <label class="form-label">备注</label>
                <input type="text" class="form-input" placeholder="添加备注..." value="原材料采购">
            </div>
            
            <div class="form-group">
                <label class="form-label">部门</label>
                <select class="form-input">
                    <option>采购部门</option>
                    <option>销售部门</option>
                    <option>人事部门</option>
                    <option>物流部门</option>
                    <option>财务部门</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">附件</label>
                <div class="flex items-center justify-center border border-dashed border-gray-300 rounded-lg p-4">
                    <div class="text-center">
                        <i class="fas fa-upload text-gray-400 text-2xl mb-2"></i>
                        <p class="text-gray-500 text-sm">上传发票或收据</p>
                    </div>
                </div>
            </div>
            
            <button class="submit-button">保存</button>
        </div>
    </div>
</body>
</html>
