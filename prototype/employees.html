<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理 - 随手记ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            margin: 0;
            padding: 0;
        }
        .employees-container {
            padding: 15px;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tab-container {
            display: flex;
            border-bottom: 1px solid #E5E5EA;
            margin-bottom: 15px;
        }
        .tab {
            padding: 10px 15px;
            font-size: 14px;
            color: #8E8E93;
            position: relative;
        }
        .tab.active {
            color: #007AFF;
            font-weight: 600;
        }
        .tab.active:after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 15px;
            right: 15px;
            height: 2px;
            background-color: #007AFF;
            border-radius: 1px;
        }
        .search-bar {
            display: flex;
            background-color: #F2F2F7;
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 15px;
        }
        .search-bar i {
            color: #8E8E93;
            margin-right: 10px;
        }
        .search-bar input {
            border: none;
            background: transparent;
            width: 100%;
            outline: none;
            font-size: 16px;
        }
        .employee-item {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #F2F2F7;
        }
        .employee-item:last-child {
            border-bottom: none;
        }
        .employee-avatar {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            overflow: hidden;
            margin-right: 12px;
        }
        .employee-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .employee-details {
            flex: 1;
        }
        .department-badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            background-color: #F2F2F7;
            color: #8E8E93;
        }
        .filter-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .filter-button {
            background-color: #F2F2F7;
            border-radius: 15px;
            padding: 5px 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
        }
        .filter-button i {
            margin-right: 5px;
        }
        .add-button {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background-color: #007AFF;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-card {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .stat-value {
            font-size: 20px;
            font-weight: 600;
            margin: 5px 0;
        }
        .stat-label {
            font-size: 12px;
            color: #8E8E93;
        }
        .department-list {
            display: flex;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .department-item {
            flex: 0 0 auto;
            padding: 8px 15px;
            background-color: #F2F2F7;
            border-radius: 20px;
            margin-right: 10px;
            font-size: 14px;
            color: #8E8E93;
            white-space: nowrap;
        }
        .department-item.active {
            background-color: #007AFF;
            color: white;
        }
    </style>
</head>
<body>
    <div class="employees-container">
        <div class="header">
            <h1 class="text-xl font-bold">员工管理</h1>
            <div class="flex">
                <i class="fas fa-chart-pie text-gray-600 text-xl mr-4"></i>
                <i class="fas fa-filter text-gray-600 text-xl"></i>
            </div>
        </div>
        
        <div class="tab-container">
            <div class="tab active">员工</div>
            <div class="tab">排班</div>
            <div class="tab">工资</div>
            <div class="tab">绩效</div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">24</div>
                <div class="stat-label">员工总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">¥8,450</div>
                <div class="stat-label">平均工资</div>
            </div>
        </div>
        
        <div class="department-list">
            <div class="department-item active">全部</div>
            <div class="department-item">销售部</div>
            <div class="department-item">采购部</div>
            <div class="department-item">生产部</div>
            <div class="department-item">财务部</div>
            <div class="department-item">人事部</div>
            <div class="department-item">物流部</div>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="搜索员工...">
        </div>
        
        <div class="card">
            <div class="employee-item">
                <div class="employee-avatar">
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="员工头像">
                </div>
                <div class="employee-details">
                    <div class="flex justify-between">
                        <p class="font-medium">张三</p>
                        <span class="department-badge">销售部</span>
                    </div>
                    <div class="flex justify-between mt-1">
                        <p class="text-gray-500 text-xs">销售经理</p>
                        <p class="text-blue-500 text-xs">查看详情</p>
                    </div>
                </div>
            </div>
            
            <div class="employee-item">
                <div class="employee-avatar">
                    <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="员工头像">
                </div>
                <div class="employee-details">
                    <div class="flex justify-between">
                        <p class="font-medium">李四</p>
                        <span class="department-badge">采购部</span>
                    </div>
                    <div class="flex justify-between mt-1">
                        <p class="text-gray-500 text-xs">采购专员</p>
                        <p class="text-blue-500 text-xs">查看详情</p>
                    </div>
                </div>
            </div>
            
            <div class="employee-item">
                <div class="employee-avatar">
                    <img src="https://randomuser.me/api/portraits/men/67.jpg" alt="员工头像">
                </div>
                <div class="employee-details">
                    <div class="flex justify-between">
                        <p class="font-medium">王五</p>
                        <span class="department-badge">生产部</span>
                    </div>
                    <div class="flex justify-between mt-1">
                        <p class="text-gray-500 text-xs">生产主管</p>
                        <p class="text-blue-500 text-xs">查看详情</p>
                    </div>
                </div>
            </div>
            
            <div class="employee-item">
                <div class="employee-avatar">
                    <img src="https://randomuser.me/api/portraits/women/17.jpg" alt="员工头像">
                </div>
                <div class="employee-details">
                    <div class="flex justify-between">
                        <p class="font-medium">赵六</p>
                        <span class="department-badge">财务部</span>
                    </div>
                    <div class="flex justify-between mt-1">
                        <p class="text-gray-500 text-xs">财务经理</p>
                        <p class="text-blue-500 text-xs">查看详情</p>
                    </div>
                </div>
            </div>
            
            <div class="employee-item">
                <div class="employee-avatar">
                    <img src="https://randomuser.me/api/portraits/men/91.jpg" alt="员工头像">
                </div>
                <div class="employee-details">
                    <div class="flex justify-between">
                        <p class="font-medium">钱七</p>
                        <span class="department-badge">人事部</span>
                    </div>
                    <div class="flex justify-between mt-1">
                        <p class="text-gray-500 text-xs">人事专员</p>
                        <p class="text-blue-500 text-xs">查看详情</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="add-button">
            <i class="fas fa-plus"></i>
        </div>
    </div>
</body>
</html>
