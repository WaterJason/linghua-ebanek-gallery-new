<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库存管理 - 随手记ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            margin: 0;
            padding: 0;
        }
        .inventory-container {
            padding: 15px;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tab-container {
            display: flex;
            border-bottom: 1px solid #E5E5EA;
            margin-bottom: 15px;
        }
        .tab {
            padding: 10px 15px;
            font-size: 14px;
            color: #8E8E93;
            position: relative;
        }
        .tab.active {
            color: #007AFF;
            font-weight: 600;
        }
        .tab.active:after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 15px;
            right: 15px;
            height: 2px;
            background-color: #007AFF;
            border-radius: 1px;
        }
        .search-bar {
            display: flex;
            background-color: #F2F2F7;
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 15px;
        }
        .search-bar i {
            color: #8E8E93;
            margin-right: 10px;
        }
        .search-bar input {
            border: none;
            background: transparent;
            width: 100%;
            outline: none;
            font-size: 16px;
        }
        .inventory-item {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #F2F2F7;
        }
        .inventory-item:last-child {
            border-bottom: none;
        }
        .inventory-image {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background-color: #F2F2F7;
            margin-right: 12px;
            overflow: hidden;
        }
        .inventory-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .inventory-details {
            flex: 1;
        }
        .inventory-status {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 4px;
            margin-right: 5px;
        }
        .status-normal {
            background-color: #34C759;
        }
        .status-warning {
            background-color: #FF9500;
        }
        .status-alert {
            background-color: #FF3B30;
        }
        .filter-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .filter-button {
            background-color: #F2F2F7;
            border-radius: 15px;
            padding: 5px 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
        }
        .filter-button i {
            margin-right: 5px;
        }
        .add-button {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background-color: #007AFF;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-card {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .stat-value {
            font-size: 20px;
            font-weight: 600;
            margin: 5px 0;
        }
        .stat-label {
            font-size: 12px;
            color: #8E8E93;
        }
    </style>
</head>
<body>
    <div class="inventory-container">
        <div class="header">
            <h1 class="text-xl font-bold">库存管理</h1>
            <div class="flex">
                <i class="fas fa-qrcode text-gray-600 text-xl mr-4"></i>
                <i class="fas fa-filter text-gray-600 text-xl"></i>
            </div>
        </div>
        
        <div class="tab-container">
            <div class="tab active">概览</div>
            <div class="tab">产品</div>
            <div class="tab">原材料</div>
            <div class="tab">预警</div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">256</div>
                <div class="stat-label">总库存数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">¥124,580</div>
                <div class="stat-label">库存总值</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">12</div>
                <div class="stat-label">预警数量</div>
            </div>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="搜索产品或原材料...">
        </div>
        
        <div class="filter-bar">
            <div class="filter-button">
                <i class="fas fa-warehouse"></i>
                <span>全部仓库</span>
            </div>
            <div class="filter-button">
                <i class="fas fa-sort-amount-down"></i>
                <span>按库存量排序</span>
            </div>
            <div class="filter-button">
                <i class="fas fa-tag"></i>
                <span>全部分类</span>
            </div>
        </div>
        
        <div class="card">
            <h3 class="text-base font-semibold mb-3">库存预警</h3>
            
            <div class="inventory-item">
                <div class="inventory-image">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="产品A">
                </div>
                <div class="inventory-details">
                    <div class="flex justify-between">
                        <p class="font-medium">产品A</p>
                        <p class="font-medium text-red-500">5件</p>
                    </div>
                    <p class="text-gray-500 text-xs">SKU: PA001</p>
                    <div class="inventory-status">
                        <div class="status-indicator status-alert"></div>
                        <span class="text-xs text-red-500">库存不足</span>
                    </div>
                </div>
            </div>
            
            <div class="inventory-item">
                <div class="inventory-image">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e" alt="产品B">
                </div>
                <div class="inventory-details">
                    <div class="flex justify-between">
                        <p class="font-medium">原材料B</p>
                        <p class="font-medium text-yellow-500">15件</p>
                    </div>
                    <p class="text-gray-500 text-xs">SKU: MB002</p>
                    <div class="inventory-status">
                        <div class="status-indicator status-warning"></div>
                        <span class="text-xs text-yellow-500">即将不足</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h3 class="text-base font-semibold mb-3">热销产品</h3>
            
            <div class="inventory-item">
                <div class="inventory-image">
                    <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f" alt="产品C">
                </div>
                <div class="inventory-details">
                    <div class="flex justify-between">
                        <p class="font-medium">产品C</p>
                        <p class="font-medium">120件</p>
                    </div>
                    <p class="text-gray-500 text-xs">SKU: PC003</p>
                    <div class="inventory-status">
                        <div class="status-indicator status-normal"></div>
                        <span class="text-xs text-green-500">库存充足</span>
                    </div>
                </div>
            </div>
            
            <div class="inventory-item">
                <div class="inventory-image">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="产品D">
                </div>
                <div class="inventory-details">
                    <div class="flex justify-between">
                        <p class="font-medium">产品D</p>
                        <p class="font-medium">85件</p>
                    </div>
                    <p class="text-gray-500 text-xs">SKU: PD004</p>
                    <div class="inventory-status">
                        <div class="status-indicator status-normal"></div>
                        <span class="text-xs text-green-500">库存充足</span>
                    </div>
                </div>
            </div>
            
            <div class="inventory-item">
                <div class="inventory-image">
                    <img src="https://images.unsplash.com/photo-1560343090-f0409e92791a" alt="产品E">
                </div>
                <div class="inventory-details">
                    <div class="flex justify-between">
                        <p class="font-medium">产品E</p>
                        <p class="font-medium">42件</p>
                    </div>
                    <p class="text-gray-500 text-xs">SKU: PE005</p>
                    <div class="inventory-status">
                        <div class="status-indicator status-normal"></div>
                        <span class="text-xs text-green-500">库存充足</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="add-button">
            <i class="fas fa-plus"></i>
        </div>
    </div>
</body>
</html>
