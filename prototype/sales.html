<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售管理 - 随手记ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            margin: 0;
            padding: 0;
        }
        .sales-container {
            padding: 15px;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tab-container {
            display: flex;
            border-bottom: 1px solid #E5E5EA;
            margin-bottom: 15px;
        }
        .tab {
            padding: 10px 15px;
            font-size: 14px;
            color: #8E8E93;
            position: relative;
        }
        .tab.active {
            color: #007AFF;
            font-weight: 600;
        }
        .tab.active:after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 15px;
            right: 15px;
            height: 2px;
            background-color: #007AFF;
            border-radius: 1px;
        }
        .search-bar {
            display: flex;
            background-color: #F2F2F7;
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 15px;
        }
        .search-bar i {
            color: #8E8E93;
            margin-right: 10px;
        }
        .search-bar input {
            border: none;
            background: transparent;
            width: 100%;
            outline: none;
            font-size: 16px;
        }
        .sales-item {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #F2F2F7;
        }
        .sales-item:last-child {
            border-bottom: none;
        }
        .sales-icon {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background-color: #F2F2F7;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 20px;
        }
        .sales-details {
            flex: 1;
        }
        .status-badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }
        .status-completed {
            background-color: #E8F5E9;
            color: #34C759;
        }
        .status-pending {
            background-color: #FFF8E1;
            color: #FF9500;
        }
        .status-processing {
            background-color: #E3F2FD;
            color: #007AFF;
        }
        .filter-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .filter-button {
            background-color: #F2F2F7;
            border-radius: 15px;
            padding: 5px 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
        }
        .filter-button i {
            margin-right: 5px;
        }
        .add-button {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background-color: #007AFF;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-card {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .stat-value {
            font-size: 20px;
            font-weight: 600;
            margin: 5px 0;
        }
        .stat-label {
            font-size: 12px;
            color: #8E8E93;
        }
        .chart-container {
            height: 200px;
            margin-top: 10px;
            position: relative;
        }
        .chart-placeholder {
            width: 100%;
            height: 100%;
            background-color: #F9F9F9;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="sales-container">
        <div class="header">
            <h1 class="text-xl font-bold">销售管理</h1>
            <div class="flex">
                <i class="fas fa-calendar-alt text-gray-600 text-xl mr-4"></i>
                <i class="fas fa-chart-bar text-gray-600 text-xl"></i>
            </div>
        </div>
        
        <div class="tab-container">
            <div class="tab active">订单</div>
            <div class="tab">客户</div>
            <div class="tab">统计</div>
            <div class="tab">POS</div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">¥36,450</div>
                <div class="stat-label">本月销售额</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">42</div>
                <div class="stat-label">本月订单数</div>
            </div>
        </div>
        
        <div class="card">
            <h3 class="text-base font-semibold mb-2">销售趋势</h3>
            <p class="text-xs text-gray-500 mb-2">近7天销售额</p>
            
            <div class="chart-container">
                <div class="chart-placeholder">
                    <img src="https://via.placeholder.com/300x150?text=销售趋势图" alt="销售趋势图" class="w-full h-full object-cover rounded-lg">
                </div>
            </div>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="搜索订单或客户...">
        </div>
        
        <div class="filter-bar">
            <div class="filter-button">
                <i class="fas fa-filter"></i>
                <span>全部状态</span>
            </div>
            <div class="filter-button">
                <i class="fas fa-calendar"></i>
                <span>本月</span>
            </div>
            <div class="filter-button">
                <i class="fas fa-sort-amount-down"></i>
                <span>按时间排序</span>
            </div>
        </div>
        
        <div class="card">
            <h3 class="text-base font-semibold mb-3">最近订单</h3>
            
            <div class="sales-item">
                <div class="sales-icon bg-green-50 text-green-500">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <div class="sales-details">
                    <div class="flex justify-between">
                        <p class="font-medium">订单 #SO-2505</p>
                        <p class="font-medium">¥4,850</p>
                    </div>
                    <div class="flex justify-between mt-1">
                        <p class="text-gray-500 text-xs">张三 - 今天 11:15</p>
                        <span class="status-badge status-completed">已完成</span>
                    </div>
                </div>
            </div>
            
            <div class="sales-item">
                <div class="sales-icon bg-blue-50 text-blue-500">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <div class="sales-details">
                    <div class="flex justify-between">
                        <p class="font-medium">订单 #SO-2504</p>
                        <p class="font-medium">¥6,300</p>
                    </div>
                    <div class="flex justify-between mt-1">
                        <p class="text-gray-500 text-xs">李四 - 昨天 15:20</p>
                        <span class="status-badge status-processing">处理中</span>
                    </div>
                </div>
            </div>
            
            <div class="sales-item">
                <div class="sales-icon bg-yellow-50 text-yellow-500">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <div class="sales-details">
                    <div class="flex justify-between">
                        <p class="font-medium">订单 #SO-2503</p>
                        <p class="font-medium">¥3,200</p>
                    </div>
                    <div class="flex justify-between mt-1">
                        <p class="text-gray-500 text-xs">王五 - 5月22日</p>
                        <span class="status-badge status-pending">待付款</span>
                    </div>
                </div>
            </div>
            
            <div class="sales-item">
                <div class="sales-icon bg-green-50 text-green-500">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <div class="sales-details">
                    <div class="flex justify-between">
                        <p class="font-medium">订单 #SO-2502</p>
                        <p class="font-medium">¥5,120</p>
                    </div>
                    <div class="flex justify-between mt-1">
                        <p class="text-gray-500 text-xs">赵六 - 5月21日</p>
                        <span class="status-badge status-completed">已完成</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h3 class="text-base font-semibold mb-3">热门客户</h3>
            
            <div class="sales-item">
                <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="客户头像" class="w-12 h-12 rounded-full mr-3">
                <div class="sales-details">
                    <div class="flex justify-between">
                        <p class="font-medium">张三</p>
                        <p class="font-medium">¥12,450</p>
                    </div>
                    <div class="flex justify-between mt-1">
                        <p class="text-gray-500 text-xs">共8笔订单</p>
                        <p class="text-green-500 text-xs">+15% ↑</p>
                    </div>
                </div>
            </div>
            
            <div class="sales-item">
                <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="客户头像" class="w-12 h-12 rounded-full mr-3">
                <div class="sales-details">
                    <div class="flex justify-between">
                        <p class="font-medium">李四</p>
                        <p class="font-medium">¥9,680</p>
                    </div>
                    <div class="flex justify-between mt-1">
                        <p class="text-gray-500 text-xs">共6笔订单</p>
                        <p class="text-green-500 text-xs">+8% ↑</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="add-button">
            <i class="fas fa-plus"></i>
        </div>
    </div>
</body>
</html>
