<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页 - 随手记ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            margin: 0;
            padding: 0;
        }
        .dashboard-container {
            padding: 15px;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        .action-icon {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background-color: #F2F2F7;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 20px;
        }
        .chart-container {
            height: 200px;
            margin-top: 10px;
            position: relative;
        }
        .chart-placeholder {
            width: 100%;
            height: 100%;
            background-color: #F9F9F9;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }
        .recent-transactions {
            margin-top: 15px;
        }
        .transaction-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #F2F2F7;
        }
        .transaction-item:last-child {
            border-bottom: none;
        }
        .transaction-icon {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background-color: #F2F2F7;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 16px;
        }
        .expense {
            color: #FF3B30;
        }
        .income {
            color: #34C759;
        }
        .alert-badge {
            background-color: #FF3B30;
            color: white;
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <div>
                <h1 class="text-xl font-bold">你好，张经理</h1>
                <p class="text-gray-500 text-sm">今天是 2025年5月24日</p>
            </div>
            <div class="flex">
                <div class="mr-4 relative">
                    <i class="fas fa-bell text-gray-600 text-xl"></i>
                    <span class="alert-badge absolute -top-1 -right-1">3</span>
                </div>
                <div>
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Profile" class="w-10 h-10 rounded-full">
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-gray-500 text-sm">本月收支</p>
                    <h2 class="text-2xl font-bold">¥24,568.00</h2>
                </div>
                <div class="flex">
                    <div class="mr-4 text-right">
                        <p class="text-gray-500 text-xs">收入</p>
                        <p class="text-green-500 font-semibold">¥36,450.00</p>
                    </div>
                    <div class="text-right">
                        <p class="text-gray-500 text-xs">支出</p>
                        <p class="text-red-500 font-semibold">¥11,882.00</p>
                    </div>
                </div>
            </div>
            
            <div class="chart-container">
                <div class="chart-placeholder">
                    <img src="https://via.placeholder.com/300x150?text=收支趋势图" alt="收支趋势图" class="w-full h-full object-cover rounded-lg">
                </div>
            </div>
        </div>
        
        <div class="quick-actions card">
            <h3 class="text-lg font-semibold mb-3">快捷功能</h3>
            <div class="grid grid-cols-4 gap-2">
                <div class="action-item">
                    <div class="action-icon bg-blue-50 text-blue-500">
                        <i class="fas fa-plus"></i>
                    </div>
                    <span class="text-xs">记账</span>
                </div>
                <div class="action-item">
                    <div class="action-icon bg-green-50 text-green-500">
                        <i class="fas fa-box"></i>
                    </div>
                    <span class="text-xs">库存</span>
                </div>
                <div class="action-item">
                    <div class="action-icon bg-purple-50 text-purple-500">
                        <i class="fas fa-shopping-cart"></i>
                    </div>
                    <span class="text-xs">销售</span>
                </div>
                <div class="action-item">
                    <div class="action-icon bg-yellow-50 text-yellow-500">
                        <i class="fas fa-truck"></i>
                    </div>
                    <span class="text-xs">采购</span>
                </div>
                <div class="action-item">
                    <div class="action-icon bg-red-50 text-red-500">
                        <i class="fas fa-users"></i>
                    </div>
                    <span class="text-xs">员工</span>
                </div>
                <div class="action-item">
                    <div class="action-icon bg-indigo-50 text-indigo-500">
                        <i class="fas fa-chart-pie"></i>
                    </div>
                    <span class="text-xs">报表</span>
                </div>
                <div class="action-item">
                    <div class="action-icon bg-pink-50 text-pink-500">
                        <i class="fas fa-cog"></i>
                    </div>
                    <span class="text-xs">设置</span>
                </div>
                <div class="action-item">
                    <div class="action-icon bg-gray-50 text-gray-500">
                        <i class="fas fa-ellipsis-h"></i>
                    </div>
                    <span class="text-xs">更多</span>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-lg font-semibold">最近交易</h3>
                <span class="text-blue-500 text-sm">查看全部</span>
            </div>
            
            <div class="recent-transactions">
                <div class="transaction-item">
                    <div class="flex items-center">
                        <div class="transaction-icon bg-red-50 text-red-500">
                            <i class="fas fa-shopping-bag"></i>
                        </div>
                        <div>
                            <p class="font-medium">原材料采购</p>
                            <p class="text-gray-500 text-xs">今天 14:30</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="expense font-medium">-¥2,500.00</p>
                        <p class="text-gray-500 text-xs">采购部门</p>
                    </div>
                </div>
                
                <div class="transaction-item">
                    <div class="flex items-center">
                        <div class="transaction-icon bg-green-50 text-green-500">
                            <i class="fas fa-hand-holding-usd"></i>
                        </div>
                        <div>
                            <p class="font-medium">产品销售</p>
                            <p class="text-gray-500 text-xs">今天 11:15</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="income font-medium">+¥4,850.00</p>
                        <p class="text-gray-500 text-xs">销售部门</p>
                    </div>
                </div>
                
                <div class="transaction-item">
                    <div class="flex items-center">
                        <div class="transaction-icon bg-blue-50 text-blue-500">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <div>
                            <p class="font-medium">员工工资</p>
                            <p class="text-gray-500 text-xs">昨天 16:45</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="expense font-medium">-¥3,200.00</p>
                        <p class="text-gray-500 text-xs">人事部门</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-lg font-semibold">库存预警</h3>
                <span class="text-blue-500 text-sm">查看全部</span>
            </div>
            
            <div class="flex items-center justify-between p-3 bg-red-50 rounded-lg mb-2">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-triangle text-red-500 mr-2"></i>
                    <span>产品A库存不足</span>
                </div>
                <span class="text-red-500 font-medium">剩余5件</span>
            </div>
            
            <div class="flex items-center justify-between p-3 bg-yellow-50 rounded-lg">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle text-yellow-500 mr-2"></i>
                    <span>原材料B即将不足</span>
                </div>
                <span class="text-yellow-500 font-medium">剩余15件</span>
            </div>
        </div>
    </div>
</body>
</html>
